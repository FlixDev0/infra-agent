[project]
name = "infra-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "docker>=7.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "apscheduler>=3.10",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.setuptools]
packages = ["agent", "agent.observer", "agent.diff", "agent.diff.rules",
            "agent.remediator", "agent.remediator.handlers", "agent.audit",
            "api", "api.routes",
            "models",
            "dashboard", "dashboard.components"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88