version: "1.0"
environment: staging

services:
  - name: api-backend
    type: container
    image: infra-agent-api-backend:latest
    replicas: 1
    ports:
      - host: 8080
        container: 80
    env: {}
    restart_policy: always

  - name: worker-queue
    type: container
    image: infra-agent-worker-queue:latest
    replicas: 1
    ports: []
    env: {}
    restart_policy: on-failure

policies:
  allow_unknown_containers: false
  max_remediation_attempts: 3
  remediation_cooldown_seconds: 60
  dry_run: false